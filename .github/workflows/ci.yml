# Runs the checks on every pull request and every push to main. After a push to
# main, if everything passes, it deploys the frontend to Vercel.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    env:
      # The build evaluates the configuration, so the variable has to exist.
      # It is only a placeholder: the real build happens on Vercel with the URL
      # of the deployed API.
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lint script never fixes: in CI a violation has to fail, and the
      # layer boundaries are checked here too.
      - name: Lint, including the architecture boundaries
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests of the domain and the use cases
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    needs: test
    runs-on: ubuntu-latest

    env:
      # The suite builds the application here and runs it against the deployed
      # API, so a pull request is checked with its own code. The URL is a
      # repository variable because it is public; the accounts are secrets.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
      E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check that the suite is configured
        run: |
          for name in NEXT_PUBLIC_API_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_SELLER_EMAIL E2E_SELLER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. NEXT_PUBLIC_API_URL is a repository variable and the E2E_ ones are secrets, under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the application and serves it on 3001. The
      # API has to allow that origin in CORS_ORIGINS, or the browser blocks
      # every request before it leaves.
      - name: Run the suite
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    # Nothing is deployed until the unit tests and the browser tests pass.
    needs: [test, e2e]
    # Only after a push to main, never on a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      # The deploy runs from here with the Vercel CLI instead of connecting the
      # repository to Vercel: their GitHub integration asks for a Pro plan to
      # read a private repository of an organisation, and this one belongs to
      # ICESI-CI3. The CLI does not go through that integration.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check that the deploy is configured
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      # Brings the project settings and its environment variables, so the build
      # uses the real API URL configured in Vercel and not a placeholder.
      - name: Pull the production settings from Vercel
        run: npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: npx --yes vercel build --prod --token="$VERCEL_TOKEN"

      # --prebuilt uploads what was just built here, so the artifact that is
      # deployed is the one these checks ran against.
      - name: Deploy
        run: npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
